  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0"
  - effect@4.0.6
  - vite-plus@1.4.0
  - "@effect/tsgo-darwin-arm64@0.59.0"
  - "@effect/tsgo-darwin-x64@0.59.0"
  - "@effect/tsgo-linux-arm64@0.59.0"
